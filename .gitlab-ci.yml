buildAndDeployApkStable:
  stage: build
  script:
    - sh deploy-stable.sh
  only:
    - tags
  when: manual
  needs: []
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/stable/release/*.apk


buildAndDeployABBPlaystore
  stage: build
  script:
    - sh deploy-stable-ps.sh
  only:
    - tags
  when: manual
  needs: []
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/playstoreRelease/app-playstore-release.abb
